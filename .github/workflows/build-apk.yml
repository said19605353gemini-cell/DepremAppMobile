name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install Dependencies
      run: npm install

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Deprem-Radar-Release-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "Deprem Radar v1.0.0 (Android APK)"
        body: |
          ### 📱 Deprem Radar Mobil Android APK
          - AFAD & USGS Canlı Deprem Verileri
          - Son 7 Gün / 30 Günlük Geçmiş Filtresi
          - Ülke ve Şehir Arama
          - İnteraktif Harita Görünümü
          - Tüm Android Cihazlarla Uyumlu
        files: android/app/build/outputs/apk/debug/app-debug.apk
